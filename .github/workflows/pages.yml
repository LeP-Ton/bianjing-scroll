name: 部署汴京寻物预览

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 发布同仓库预览
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出当前正式版本
        uses: actions/checkout@v6
        with:
          ref: a7a8aa9f824cdb5ee4905e6894938d8b31daa5ec
          path: production
          persist-credentials: false

      - name: 检出预览分支
        uses: actions/checkout@v6
        with:
          path: candidate
          persist-credentials: false

      - name: 组装并核对整站制品
        run: |
          test -s production/dist/index.html
          test -s candidate/dist/index.html
          test ! -e production/dist/preview
          node --check production/dist/app.js
          node --check candidate/dist/app.js
          mkdir -p pages/preview
          cp -a production/dist/. pages/
          cp -a candidate/dist/. pages/preview/
          diff -qr --exclude=preview production/dist pages
          diff -qr candidate/dist pages/preview

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传整站制品
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: 核对正式分支仍为基线版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          production_sha=$(git -C production rev-parse HEAD)
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$production_sha"

      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
